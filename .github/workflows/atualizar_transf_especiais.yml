name: Atualizar transferências especiais (módulo completo)

on:
  schedule:
    # Todo dia às 03:30 em Araguaína (UTC-3).
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do workflow de fundo a fundo: os dois fazem commit na mesma branch.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar-transf-especiais:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar os 24 endpoints do módulo (TO)
        # Se algum endpoint falhar, o coletor não substitui a coleta anterior e o job falha:
        # nada incompleto chega ao commit.
        run: python -m backend.especiais.coleta --workers 6

      - name: Copiar dados para public/data/
        run: |
          rm -rf public/data/transf_especiais
          cp -r dataset/transf_especiais public/data/transf_especiais

      - name: Registrar no histórico (só quando os dados mudaram)
        # Só informativo: não falha o job. Compara a planilha de planos com a do commit anterior.
        run: |
          if git diff --quiet HEAD -- dataset/transf_especiais; then
            echo "Sem mudanças; histórico não alterado."
            exit 0
          fi
          git show "HEAD:dataset/transf_especiais/planos_acao.csv" > "$RUNNER_TEMP/anterior_planos.csv" 2>/dev/null || true
          python scripts/comparar_execucoes.py             --anterior "$RUNNER_TEMP/anterior_planos.csv"             --atual dataset/transf_especiais/planos_acao.csv             --chave id_plano_acao --titulo "Transferências especiais (módulo completo)"             --historico public/data/historico.json --dataset-id transf-especiais-completo >> "$GITHUB_STEP_SUMMARY"

      - name: Commitar apenas se os dados mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/transf_especiais public/data/transf_especiais public/data/historico.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados de transferências especiais."
            exit 0
          fi
          DATA_ATUALIZACAO="$(TZ=America/Araguaina date '+%d/%m/%Y %H:%M')"
          git commit -m "🤖 [AUTO] Transferências especiais atualizadas em ${DATA_ATUALIZACAO}"
          git pull --rebase
          git push
